# Actualiza los archivos de datos del panel y los publica en GitHub Pages.
# - Noticias: en cada corrida (GitHub las dispara cada pocas horas)
# - Flujos de bonos/ONs/LECAP/CER, carteras públicas (13F) y balances: una vez por día,
#   en la primera corrida del día (no depende de que GitHub dispare un horario puntual)
name: Actualizar datos

on:
  schedule:
    - cron: '7,37 * * * *'   # minutos "raros": GitHub saltea menos estas corridas que las de en punto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Noticias
        run: node actualizar-noticias.js

      - name: ¿Toca la actualización diaria?
        id: diario
        run: |
          hoy=$(date -u +%F)
          ult=$(node -p "try { require('./flujos.json').descargado } catch (e) { '' }")
          echo "hoy=$hoy, última actualización diaria=$ult"
          if [ "$ult" != "$hoy" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "toca=true" >> "$GITHUB_OUTPUT"; fi

      - name: Flujos de fondos
        if: steps.diario.outputs.toca == 'true'
        continue-on-error: true   # si una fuente falla, igual se guarda el resto
        run: node actualizar-flujos.js

      - name: Carteras públicas (13F)
        if: steps.diario.outputs.toca == 'true'
        continue-on-error: true   # si una fuente falla, igual se guarda el resto
        run: node actualizar-carteras.js
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

      - name: Balances de empresas (SEC)
        if: steps.diario.outputs.toca == 'true'
        continue-on-error: true   # si una fuente falla, igual se guarda el resto
        run: node actualizar-fundamentales.js
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json flujos.json carteras.json fundamentales.json .cache-figi.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
